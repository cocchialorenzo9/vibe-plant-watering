name: Evening watering reminder

on:
  schedule:
    # 19:00 Europe/Berlin is 17:00 UTC (CEST) or 18:00 UTC (CET). Fire an
    # hourly band around both to absorb GitHub cron drift; the job gates to
    # the Berlin evening and settings.lastRemindedOn stops repeat sends.
    - cron: "0 16-21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the email instead of sending"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # unflagged TypeScript type-stripping for the domain imports

      - name: Gate to the Berlin evening
        id: gate
        run: |
          HOUR=$(TZ=Europe/Berlin date +%-H)
          echo "Berlin hour: $HOUR"
          # 19:00–21:59 covers the target plus cron drift; the dedup marker
          # in the data file prevents a second email the same evening.
          if { [ "$HOUR" -ge 19 ] && [ "$HOUR" -le 21 ]; } || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send reminder
        if: steps.gate.outputs.run == 'true'
        run: node scripts/send-reminder.mjs
        env:
          FIREBASE_DB_URL: ${{ vars.FIREBASE_DB_URL }}
          FIREBASE_DB_AUTH: ${{ secrets.FIREBASE_DB_AUTH }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REMINDER_TO: ${{ secrets.REMINDER_TO }}
          REMINDER_FROM: ${{ vars.REMINDER_FROM || 'Plant Watering <onboarding@resend.dev>' }}
          APP_URL: ${{ vars.APP_URL }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
